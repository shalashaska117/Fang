[package]
name = "fang-tptp-signed-bundle"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "BSD-3-Clause"

[dependencies]
fang = { path = "../.." }
fang-tptp-full-frontend-candidate = { package = "fang-tptp-roles", path = "../tptp-roles" }
fang-tptp-coverage-candidate = { path = "../tptp-coverage" }
fang-tptp-signed-roles = { path = "../tptp-signed-roles" }
fang-fof-equality-bridge = { path = "../fof-equality-bridge" }

[dev-dependencies]
# The staged search crate of the signed crate; the tests name its prepared-problem error.
fang-equality-search = { path = "../equality-search" }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
